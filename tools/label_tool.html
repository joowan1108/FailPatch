<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FailPatch Labeling</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f6fdb; --ok: #1e8a4c; --bad: #c4382e; --warn: #b7791f; --sel: #2f6fdb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1e; --ink: #ecebe6; --muted: #9b9a94; --line: #34332f;
          --accent: #6d9cf0; --ok: #4cc283; --bad: #ef6d62; --warn: #e2a84b; --sel: #6d9cf0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
select, button, input[type=range] { font: inherit; }
button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.on { outline: 2px solid var(--accent); }
.muted { color: var(--muted); }
main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; background: var(--panel); }
aside .item { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
aside .item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.b-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.b-bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.b-warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
section#view { padding: 14px 18px 60px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 16px; font-weight: 600; }
ol.subtasks { margin: 6px 0 0 0; padding-left: 22px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.grid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 170px), 1fr)); }
.tile { position: relative; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; }
.tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
.tile .lab { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; padding: 0 5px; border-radius: 4px; }
.tile.sel { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
.tile.after { opacity: .75; }
.tile.opus::after { content: "Opus"; position: absolute; right: 4px; top: 4px; background: var(--warn); color: #000; font-size: 11px; padding: 0 5px; border-radius: 4px; }
textarea { width: 100%; min-height: 48px; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.opusbox { border-left: 3px solid var(--warn); padding-left: 10px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 20; color: #fff; }
#lightbox img { max-width: 92vw; max-height: 82vh; image-rendering: auto; }
#lightbox .cap { margin-top: 8px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 12px; }
.help { font-size: 13px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: 220px; } }
</style>
</head>
<body>
<header>
  <h1>FailPatch 라벨링</h1>
  <select id="fTask"></select>
  <label><input type="checkbox" id="fSample" checked> 표본만</label>
  <label><input type="checkbox" id="fTodo"> 미완료만</label>
  <span id="progress" class="muted"></span>
  <span style="flex:1"></span>
  <label class="muted">타일 크기 <input type="range" id="tileSize" min="110" max="300" value="170"></label>
  <button id="btnOpus" title="Opus 판단을 항상 표시 (편향 주의)">Opus 판단 표시: 끔</button>
  <button id="btnStats">비교 결과</button>
  <button id="btnImport">불러오기</button>
  <button id="btnExport" class="primary">JSON 저장</button>
  <input type="file" id="importFile" accept=".json" hidden>
</header>
<main>
  <aside id="list"></aside>
  <section id="view"></section>
</main>
<div id="lightbox"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
<script src="data.js"></script>
<script>
const DATA = (window.LABEL_DATA || {episodes: []}).episodes;
const KEY = "failpatch_human_labels_v1";
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { labels = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} };
let showOpus = false, revealed = new Set(), current = null, lbIndex = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const SHORT = {CoffeeSetupMug: "Coffee", GetToastedBread: "Toast", SteamInMicrowave: "Steam"};
const TASK_KO = {CoffeeSetupMug: "커피 머신 아래에 머그 놓기", GetToastedBread: "토스트 꺼내 접시에 놓기", SteamInMicrowave: "채소를 그릇에 담아 전자레인지로 찌기"};

const tasks = [...new Set(DATA.map(e => e.task))];
$("fTask").innerHTML = '<option value="">모든 task</option>' + tasks.map(t => `<option>${t}</option>`).join("");
const done = e => { const l = labels[e.id]; return !!l && (e.success ? l.reliable_success !== undefined : l.failure_onset_chunk !== undefined); };
function visible() {
  return DATA.filter(e => (!$("fTask").value || e.task === $("fTask").value) && (!$("fSample").checked || e.sample) && (!$("fTodo").checked || !done(e) || (current && e.id === current.id)));
}
function renderList() {
  const eps = visible();
  $("list").innerHTML = eps.map(e => `<div class="item ${current && e.id === current.id ? "active" : ""}" data-id="${e.id}">
      <span>${done(e) ? "✓ " : ""}${SHORT[e.task] || e.task} ${e.episode.replace("ep_", "#")}</span>
      <span class="badge ${e.success ? "b-ok" : "b-bad"}">${e.success ? "성공" : "실패"}</span></div>`).join("") || '<div class="item muted">해당 episode 없음</div>';
  $("list").querySelectorAll(".item[data-id]").forEach(el => el.onclick = () => open(DATA.find(e => e.id === el.dataset.id)));
  const all = visible(); $("progress").textContent = `완료 ${all.filter(done).length} / ${all.length}`;
}
function setLabel(patch) {
  const l = labels[current.id] || {};
  if (l.opus_seen_before === undefined) l.opus_seen_before = showOpus || revealed.has(current.id);
  Object.assign(l, patch, {labeled_at: new Date().toISOString(), task: current.task, episode: current.episode, success: current.success});
  labels[current.id] = l; save(); renderView(); renderList();
}
function open(e) { current = e; lbIndex = -1; renderList(); renderView(); window.scrollTo(0, 0); }
function step(d) { const eps = visible(); if (!eps.length) return; const i = Math.max(0, eps.findIndex(e => current && e.id === current.id)); open(eps[Math.min(eps.length - 1, Math.max(0, i + d))]); }

function renderView() {
  const e = current;
  if (!e) { $("view").innerHTML = '<div class="card">왼쪽에서 episode를 고르세요.</div>' + helpHtml(); return; }
  const l = labels[e.id] || {}, a = e.annotator, opusOn = showOpus || revealed.has(e.id);
  const mark = e.success ? l.issue_chunk : l.failure_onset_chunk;
  const sub = e.subtasks.map((s, i) => `<li>${esc(s)} ${l.failed_subtask === i + 1 ? '<span class="badge b-bad">선택됨</span>' : ""}</li>`).join("");
  const subButtons = e.subtasks.map((s, i) => `<button data-sub="${i + 1}" class="${l.failed_subtask === i + 1 ? "on" : ""}">${i + 1}</button>`).join("");
  const judge = e.success ? `
      <div class="controls"><b>판단:</b>
        <button data-rel="true" class="${l.reliable_success === true ? "on" : ""}">Reliable <kbd>R</kbd></button>
        <button data-rel="false" class="${l.reliable_success === false ? "on" : ""}">Unreliable <kbd>U</kbd></button>
        <button data-rel="null" class="${l.reliable_success === null ? "on" : ""}">판단 불가 <kbd>X</kbd></button>
        <span class="muted">Unreliable이면 문제가 시작된 frame을 클릭하고, 해당 subtask를 고르세요 (선택).</span></div>`
    : `<div class="controls"><b>Failure onset:</b> ${l.failure_onset_chunk === undefined ? '<span class="muted">실수가 처음 보이는 frame을 클릭하세요</span>' : l.failure_onset_chunk === null ? '<span class="badge b-warn">판단 불가</span>' : `<span class="badge b-bad">chunk ${l.failure_onset_chunk}</span>`}
        <button data-onset-null="1">판단 불가 <kbd>X</kbd></button></div>`;
  const opus = opusOn ? `<div class="card opusbox"><b>Opus 판단</b> <span class="muted">(${esc(a.model)}, ${esc(a.source)})</span><br>
        ${e.success ? `reliable_success: <b>${a.reliable_success}</b>` : `failure_onset_chunk: <b>${a.failure_onset_chunk}</b>`}
        · confidence ${a.confidence ?? "-"} ${a.failure_type ? "· type: " + esc(a.failure_type) : ""}<br><span class="muted">${esc(a.notes)}</span></div>`
    : `<div class="controls"><button id="btnReveal" ${done(e) ? "" : 'title="먼저 라벨을 정하면 편향 없이 비교할 수 있습니다"'}>이 episode의 Opus 판단 보기${done(e) ? "" : " (라벨 전)"}</button></div>`;
  $("view").innerHTML = `
    <div class="card">
      <div class="title"><span>${esc(e.task)}</span><span class="muted" style="font-weight:400">${esc(TASK_KO[e.task] || "")}</span>
        <span class="badge ${e.success ? "b-ok" : "b-bad"}" style="font-size:14px">${e.success ? "성공 episode" : "실패 episode"}</span>
        <span class="muted" style="font-weight:400">${esc(e.episode)} · ${e.chunks} chunks (chunk당 ${e.exec_steps} step, 총 ${e.steps} step) · frame ${e.frames.length}장</span></div>
      <div style="margin-top:6px"><b>Instruction:</b> ${esc(e.instruction)}</div>
      <div style="margin-top:4px"><b>Subtasks</b><ol class="subtasks">${sub}</ol></div>
      <div class="controls"><b>${e.success ? "문제가 있던" : "실패한"} subtask:</b> ${subButtons}<button data-sub="0" class="${l.failed_subtask === 0 ? "on" : ""}">모름</button></div>
      ${judge}
      <div class="controls"><label style="flex:1">메모 <textarea id="note" placeholder="선택">${esc(l.note || "")}</textarea></label></div>
      <div class="controls"><button id="prev">← 이전</button><button id="next" class="primary">다음 →</button>
        <span class="muted">frame 클릭: 선택 · 더블클릭: 크게 보기</span></div>
    </div>
    ${opus}
    <div class="grid" id="grid">${e.frames.map((c, i) => `<div class="tile ${c === mark ? "sel" : ""} ${mark !== undefined && mark !== null && c > mark ? "after" : ""} ${opusOn && (e.success ? false : a.failure_onset_chunk === c) ? "opus" : ""}" data-i="${i}">
      <img loading="lazy" src="frames/${e.task}/${e.episode}/${c}.jpg" alt="chunk ${c}"><span class="lab">t=${c}</span></div>`).join("")}</div>`;
  $("view").querySelectorAll("[data-sub]").forEach(b => b.onclick = () => setLabel({failed_subtask: +b.dataset.sub}));
  $("view").querySelectorAll("[data-rel]").forEach(b => b.onclick = () => setLabel({reliable_success: JSON.parse(b.dataset.rel)}));
  const nb = $("view").querySelector("[data-onset-null]"); if (nb) nb.onclick = () => setLabel({failure_onset_chunk: null});
  $("note").onchange = ev => setLabel({note: ev.target.value});
  $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
  const rv = $("btnReveal"); if (rv) rv.onclick = () => { revealed.add(e.id); renderView(); };
  $("grid").querySelectorAll(".tile").forEach(t => {
    const c = e.frames[+t.dataset.i];
    t.onclick = () => setLabel(e.success ? {issue_chunk: c} : {failure_onset_chunk: c});
    t.ondblclick = () => lightbox(+t.dataset.i);
  });
}
function lightbox(i) {
  const e = current; lbIndex = i;
  if (i < 0) { $("lightbox").style.display = "none"; return; }
  $("lbImg").src = `frames/${e.task}/${e.episode}/${e.frames[i]}.jpg`;
  $("lbCap").innerHTML = `chunk t=${e.frames[i]} (${i + 1}/${e.frames.length}) · <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Enter</kbd> 이 frame 선택 · <kbd>Esc</kbd> 닫기`;
  $("lightbox").style.display = "flex";
}
$("lightbox").onclick = () => lightbox(-1);
function helpHtml() {
  return `<div class="card help"><b>사용법</b><ul>
    <li><b>실패 episode</b>: 최종 실패로 이어질 <b>실수가 처음 보이는 frame</b>을 클릭합니다. 돌이킬 수 없게 된 시점이 아니라, 잘못된 동작이 처음 시작된 시점입니다 (논문 기준).</li>
    <li><b>성공 episode</b>: 잡기 실패, 충돌, 잘못 놓기, 다른 물체 선택, 오래 멈춤, 재시도가 보이면 <b>Unreliable</b>, 없으면 <b>Reliable</b>. 잠깐 흔들리는 정도는 Reliable입니다.</li>
    <li>frame은 저장된 것만 보입니다. 긴 episode는 일부 chunk만 있으니, 실수가 두 frame 사이에서 시작된 것 같으면 앞 frame을 고르세요.</li>
    <li>단축키: <kbd>←</kbd>/<kbd>→</kbd> 이전/다음 episode, <kbd>R</kbd>/<kbd>U</kbd>/<kbd>X</kbd> Reliable/Unreliable/판단 불가, <kbd>1</kbd>–<kbd>4</kbd> subtask, <kbd>0</kbd> subtask 모름.</li>
    <li>라벨은 브라우저에 자동 저장되지만, 끝나면 <b>JSON 저장</b>으로 파일을 꼭 받아 두세요. (브라우저 데이터가 지워지면 사라집니다.)</li>
    <li>Opus 판단은 기본으로 숨겨져 있습니다. 라벨을 정한 뒤에 보면 비교가 공정합니다.</li></ul></div>`;
}
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") return;
  if (lbIndex >= 0) {
    if (ev.key === "Escape") lightbox(-1);
    else if (ev.key === "ArrowRight") lightbox(Math.min(current.frames.length - 1, lbIndex + 1));
    else if (ev.key === "ArrowLeft") lightbox(Math.max(0, lbIndex - 1));
    else if (ev.key === "Enter") { const c = current.frames[lbIndex]; lightbox(-1); setLabel(current.success ? {issue_chunk: c} : {failure_onset_chunk: c}); }
    ev.preventDefault(); return;
  }
  if (!current) { if (ev.key === "ArrowRight") step(0); return; }
  const k = ev.key.toLowerCase();
  if (ev.key === "ArrowRight") step(1);
  else if (ev.key === "ArrowLeft") step(-1);
  else if (k === "r" && current.success) setLabel({reliable_success: true});
  else if (k === "u" && current.success) setLabel({reliable_success: false});
  else if (k === "x") setLabel(current.success ? {reliable_success: null} : {failure_onset_chunk: null});
  else if (/^[0-9]$/.test(k) && +k <= current.subtasks.length) setLabel({failed_subtask: +k});
  else return;
  ev.preventDefault();
});
$("tileSize").oninput = ev => document.documentElement.style.setProperty("--tile", ev.target.value + "px");
["fTask", "fSample", "fTodo"].forEach(id => $(id).onchange = () => { renderList(); if (!current) renderView(); });
$("btnOpus").onclick = () => { showOpus = !showOpus; $("btnOpus").textContent = "Opus 판단 표시: " + (showOpus ? "켬" : "끔"); $("btnOpus").classList.toggle("on", showOpus); renderView(); };
$("btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify({version: 1, exported_at: new Date().toISOString(), labels}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `human_labels_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`; a.click();
};
$("btnImport").onclick = () => $("importFile").click();
$("importFile").onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); Object.assign(labels, d.labels || d); save(); renderList(); renderView(); alert(`${Object.keys(d.labels || d).length}개 라벨을 불러왔습니다.`); });
};
$("btnStats").onclick = () => {
  const rows = DATA.filter(done), fails = rows.filter(e => !e.success && labels[e.id].failure_onset_chunk !== null && e.annotator.failure_onset_chunk !== null);
  const succ = rows.filter(e => e.success && labels[e.id].reliable_success !== null);
  const diff = fails.map(e => e.annotator.failure_onset_chunk - labels[e.id].failure_onset_chunk);
  const within = n => diff.filter(d => Math.abs(d) <= n).length;
  const mean = xs => xs.length ? (xs.reduce((s, x) => s + x, 0) / xs.length).toFixed(2) : "-";
  const agree = succ.filter(e => e.annotator.reliable_success === labels[e.id].reliable_success).length;
  const flipped = (h, o) => succ.filter(e => labels[e.id].reliable_success === h && e.annotator.reliable_success === o).length;
  alert(`실패 onset (${fails.length}개)\n  ±1 chunk 이내: ${within(1)}  ±2 이내: ${within(2)}  ±5 이내: ${within(5)}\n  평균 |차이|: ${mean(diff.map(Math.abs))} chunk, 평균 (Opus − 사람): ${mean(diff)} chunk\n\n` +
        `성공 reliable (${succ.length}개)\n  일치: ${agree}\n  사람 Reliable·Opus Unreliable: ${flipped(true, false)}\n  사람 Unreliable·Opus Reliable: ${flipped(false, true)}\n\n` +
        `(라벨 전에 Opus 판단을 본 episode: ${rows.filter(e => labels[e.id].opus_seen_before).length}개)`);
};
renderList(); renderView();
</script>
</body>
</html>
